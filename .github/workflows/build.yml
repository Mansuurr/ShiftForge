name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt pytest pyinstaller

      - name: Download local conversion engines
        shell: pwsh
        run: ./scripts/fetch-windows-engines.ps1

      - name: Test all converters and tools
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          python -m pytest -q
          python run.py --selftest
          python run.py --files-selftest
          python run.py --video-selftest

      - name: Build application folder
        run: pyinstaller ShiftForge.spec --noconfirm

      - name: Verify frozen application
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = 'offscreen'
          ./dist/ShiftForge/ShiftForge.exe --selftest
          ./dist/ShiftForge/ShiftForge.exe --files-selftest
          ./dist/ShiftForge/ShiftForge.exe --video-selftest

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\ShiftForge.iss'

      - name: Build source archive
        shell: pwsh
        run: |
          git archive --format=zip --output=dist/ShiftForge-Source.zip HEAD
          Get-FileHash dist/ShiftForge-Setup.exe, dist/ShiftForge-Source.zip -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash)  $([IO.Path]::GetFileName($_.Path))" } |
            Set-Content -Encoding ascii dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: ShiftForge-Windows
          path: |
            dist/ShiftForge-Setup.exe
            dist/ShiftForge-Source.zip
            dist/SHA256SUMS.txt

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ShiftForge-Setup.exe
            dist/ShiftForge-Source.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
